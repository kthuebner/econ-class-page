<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Econ Notes #1 Review · What Is Economics?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Roboto:wght@400;500;700&family=Permanent+Marker&display=swap" rel="stylesheet">
<style>
  :root{
    --blue:#1f6fb2;
    --blue-mid:#2b7cc4;
    --blue-dark:#123f66;
    --cyan:#29a8df;
    --gold:#f5c518;
    --ground:#d8d8d8;
    --dot:#c3c3c3;
    --panel:#eeeeee;
    --ink:#242424;
    --line:#111111;
    --ok:#2e7d4f;
    --no:#c1272d;
    --head:'Oswald',sans-serif;
    --body:'Roboto',sans-serif;
    --marker:'Permanent Marker',cursive;
    --mast:50px;
  }

  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;}

  body{
    background-color:var(--ground);
    background-image:radial-gradient(var(--dot) 1.1px, transparent 1.1px);
    background-size:6px 6px;
    color:var(--ink);
    font-family:var(--body);
    overflow:hidden;
    -webkit-text-size-adjust:100%;
  }

  /* ---------- MASTHEAD ---------- */
  .mast{
    position:fixed;top:0;left:0;right:0;height:var(--mast);
    display:flex;align-items:stretch;
    background:var(--blue);
    border-bottom:3px solid var(--line);
    z-index:60;
  }
  .mast-tab{
    background:var(--blue-dark);color:#fff;
    display:flex;align-items:center;padding:0 22px 0 14px;
    clip-path:polygon(0 0,100% 0,calc(100% - 14px) 100%,0 100%);
  }
  .mast-tab b{font-family:var(--head);font-weight:700;font-size:19px;letter-spacing:.5px;text-transform:uppercase;line-height:1;}
  .mast-mid{
    flex:1;display:flex;align-items:center;padding:0 14px;
    font-family:var(--head);font-weight:500;font-size:13px;
    letter-spacing:1.6px;text-transform:uppercase;color:rgba(255,255,255,.85);
    white-space:nowrap;overflow:hidden;
  }
  .mast-right{display:flex;align-items:center;gap:12px;padding:0 14px;}
  .dots{display:flex;gap:5px;align-items:center;}
  .dot{
    width:8px;height:8px;background:rgba(255,255,255,.3);
    border:1px solid rgba(0,0,0,.25);
    transition:background .2s ease,transform .2s ease;
  }
  .dot.done{background:#fff;}
  .dot.here{background:var(--gold);transform:scale(1.45);}
  .score{
    font-family:var(--head);font-weight:600;font-size:19px;color:#fff;
    line-height:1;white-space:nowrap;
  }
  .score i{font-style:normal;font-size:10px;letter-spacing:1.5px;color:rgba(255,255,255,.65);}

  /* ---------- STAGE ---------- */
  .stage{position:fixed;top:var(--mast);left:0;right:0;bottom:0;overflow:hidden;}
  .track{
    display:flex;height:100%;width:100%;
    transition:transform .5s cubic-bezier(.6,.02,.2,1);
    will-change:transform;
  }
  .page{
    flex:0 0 100%;height:100%;overflow-y:auto;
    padding:20px 26px 98px;
    opacity:.2;transition:opacity .4s ease;
  }
  .page.live{opacity:1;}
  .inner{max-width:900px;margin:0 auto;}

  /* ---------- SLIDE STYLE HEADER BAR ---------- */
  .headbar{
    display:flex;align-items:stretch;
    filter:drop-shadow(3px 3px 0 rgba(0,0,0,.24));
    margin-bottom:14px;
  }
  .headbar .rnum{
    background:var(--blue-dark);color:#fff;
    font-family:var(--head);font-weight:600;font-size:14px;letter-spacing:1.5px;
    display:flex;align-items:center;padding:7px 20px 7px 12px;
    clip-path:polygon(0 0,100% 0,calc(100% - 13px) 100%,0 100%);
  }
  .headbar h2{
    background:var(--blue);color:#fff;flex:1;
    font-family:var(--head);font-weight:600;
    font-size:clamp(18px,3.4vw,29px);letter-spacing:.5px;text-transform:uppercase;
    line-height:1.15;padding:6px 34px 6px 16px;margin-left:-13px;
    display:flex;align-items:center;
    clip-path:polygon(0 0,calc(100% - 20px) 0,100% 50%,calc(100% - 20px) 100%,0 100%);
  }

  /* ---------- STICKY NOTE INSTRUCTION ---------- */
  .note{
    display:inline-block;background:#fff;border:2px solid var(--line);
    font-family:var(--marker);font-size:12.5px;line-height:1.45;color:#1a1a1a;
    padding:8px 13px;margin:2px 0 18px 6px;
    transform:rotate(-.7deg);
    box-shadow:3px 3px 0 rgba(0,0,0,.22);
    max-width:620px;
  }

  /* ---------- CHIPS ---------- */
  .chip{
    display:inline-flex;align-items:center;gap:8px;
    background:#fff;color:var(--ink);
    font-family:var(--body);font-size:13px;line-height:1.35;
    padding:8px 12px;border:2px solid var(--line);
    box-shadow:2px 2px 0 rgba(0,0,0,.28);
    cursor:pointer;user-select:none;
    transition:transform .1s ease,background .12s ease,box-shadow .12s ease;
  }
  .chip:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 rgba(0,0,0,.28);}
  .chip.sel{background:var(--gold);box-shadow:4px 4px 0 rgba(0,0,0,.35);}
  .chip.ok{background:var(--ok);color:#fff;}
  .chip.no{background:var(--no);color:#fff;}
  .chip.locked{cursor:default;}
  .chip.locked:hover{transform:none;box-shadow:2px 2px 0 rgba(0,0,0,.28);}
  .badge{
    font-family:var(--head);font-weight:600;font-size:11px;
    background:var(--blue);color:#fff;
    width:18px;height:18px;flex:0 0 18px;
    display:inline-flex;align-items:center;justify-content:center;
  }
  .chip.ok .badge,.chip.no .badge{background:rgba(0,0,0,.3);}

  .pool{
    display:flex;flex-wrap:wrap;gap:9px;align-content:flex-start;
    min-height:58px;padding:12px;margin-bottom:16px;
    border:2px dashed rgba(0,0,0,.3);background:rgba(255,255,255,.35);
  }
  .pool.over{border-color:var(--blue);background:rgba(31,111,178,.12);}
  .pool.empty::after{
    content:'All placed. Hit Check answers.';
    font-family:var(--head);font-weight:500;font-size:11px;letter-spacing:2px;
    text-transform:uppercase;color:rgba(0,0,0,.35);
  }

  /* ---------- BINS ---------- */
  .bins{display:grid;gap:12px;}
  .bins.two{grid-template-columns:1fr 1fr;}
  .bins.four{grid-template-columns:repeat(4,1fr);}
  .bins.five{grid-template-columns:repeat(5,1fr);gap:16px;}
  .bin{
    position:relative;
    background:var(--panel);border:2px solid var(--line);
    box-shadow:3px 3px 0 rgba(0,0,0,.24);
    min-height:132px;padding-bottom:10px;
    transition:background .12s ease;
  }
  .bin.over{background:#fff8dd;}
  .bin-head{
    font-family:var(--head);font-weight:600;font-size:15px;letter-spacing:.8px;
    text-transform:uppercase;padding:7px 11px;margin-bottom:9px;line-height:1.15;
    border-bottom:2px solid var(--line);
  }
  .bin-head small{
    display:block;font-family:var(--body);font-weight:400;font-size:10px;
    letter-spacing:.2px;text-transform:none;opacity:.85;margin-top:2px;
  }
  .bin[data-side="blue"] .bin-head{background:var(--blue);color:#fff;}
  .bin[data-side="navy"] .bin-head{background:var(--blue-dark);color:#fff;}
  .bin[data-side="cyan"] .bin-head{background:var(--cyan);color:#0d2b3f;}
  .bin[data-side="gold"] .bin-head{background:var(--gold);color:#1a1a1a;}
  .drop{display:flex;flex-wrap:wrap;align-content:flex-start;gap:7px;padding:0 9px;min-height:76px;}

  .bins.five .bin{min-height:108px;}
  .bins.five .drop{min-height:54px;}
  .bins.five .bin-head{font-size:20px;text-align:center;}
  .bins.five .bin:not(:last-child)::after{
    content:'\203A';
    position:absolute;right:-14px;top:50%;transform:translateY(-50%);
    font-family:var(--head);font-weight:700;font-size:26px;color:var(--blue-dark);
    line-height:1;pointer-events:none;
  }

  /* ---------- MATCH ---------- */
  .match{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .mcol{display:flex;flex-direction:column;gap:8px;}
  .mhead{
    font-family:var(--head);font-weight:600;font-size:11px;letter-spacing:2.5px;
    text-transform:uppercase;color:#fff;background:var(--blue-dark);
    padding:5px 10px;border:2px solid var(--line);
  }
  .mcol .chip{width:100%;justify-content:flex-start;}
  .mcol .chip.left{background:var(--panel);font-weight:700;}
  .mcol .chip.left.sel{background:var(--gold);}
  .mcol .chip.left.ok,.mcol .chip.left.no{color:#fff;}
  .fix{
    font-family:var(--marker);font-size:11.5px;line-height:1.4;
    color:#8a1a1f;padding:1px 4px 3px;
  }

  /* ---------- FOOT BAR ---------- */
  .bar{
    position:fixed;left:0;right:0;bottom:0;
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:10px 18px;background:#fff;border-top:3px solid var(--line);z-index:50;
  }
  .verdict{font-family:var(--body);font-size:12.5px;color:#444;min-height:16px;}
  .verdict b{font-family:var(--head);font-weight:600;color:var(--blue-dark);letter-spacing:.5px;}
  .btns{display:flex;gap:9px;}
  button.act{
    font-family:var(--head);font-weight:600;font-size:15px;letter-spacing:1.2px;
    text-transform:uppercase;padding:8px 20px;cursor:pointer;line-height:1.2;
    background:var(--blue);color:#fff;border:2px solid var(--line);
    box-shadow:3px 3px 0 rgba(0,0,0,.3);
    transition:transform .1s ease,box-shadow .1s ease,opacity .12s ease;
  }
  button.act:hover:not(:disabled){transform:translate(-1px,-1px);box-shadow:5px 5px 0 rgba(0,0,0,.3);}
  button.act:disabled{opacity:.35;cursor:not-allowed;box-shadow:2px 2px 0 rgba(0,0,0,.2);}
  button.act.ghost{background:#fff;color:var(--ink);}
  button.act.go{background:var(--gold);color:#1a1a1a;}

  /* ---------- RESULTS ---------- */
  .final{text-align:center;}
  .final .headbar{text-align:left;}
  .bignum{
    font-family:var(--head);font-weight:700;
    font-size:clamp(70px,16vw,132px);line-height:.95;color:var(--blue-dark);
  }
  .bignum em{font-style:normal;font-size:.32em;color:#6d6d6d;}
  .rank{
    font-family:var(--marker);font-size:clamp(17px,3vw,24px);
    color:var(--ink);margin:6px 0 8px;line-height:1.3;
  }
  .ranksub{font-size:13.5px;line-height:1.65;color:#4a4a4a;max-width:520px;margin:0 auto 20px;}
  .tally{max-width:540px;margin:0 auto 20px;text-align:left;border:2px solid var(--line);box-shadow:3px 3px 0 rgba(0,0,0,.24);}
  .trow{
    display:flex;justify-content:space-between;align-items:center;gap:10px;
    background:#fff;padding:7px 12px;font-size:12.5px;
    border-bottom:1px solid #d0d0d0;
  }
  .trow:last-child{border-bottom:0;}
  .trow b{font-family:var(--head);font-weight:600;font-size:15px;}
  .trow.full b{color:var(--ok);}
  .trow.part b{color:#b07d00;}
  .trow.thin b{color:var(--no);}
  .backlink{
    display:inline-block;font-family:var(--head);font-weight:500;font-size:12px;
    letter-spacing:1.6px;text-transform:uppercase;color:var(--blue-dark);
    text-decoration:none;border-bottom:2px solid var(--blue-dark);padding-bottom:1px;
  }
  .backlink:hover{color:var(--no);border-color:var(--no);}

  :focus-visible{outline:3px solid var(--blue-dark);outline-offset:2px;}

  @media (max-width:760px){
    .page{padding:16px 14px 100px;}
    .bins.four{grid-template-columns:1fr 1fr;}
    .bins.five{grid-template-columns:1fr 1fr;gap:10px;}
    .bins.five .bin::after{display:none;}
    .match{grid-template-columns:1fr;gap:16px;}
    .mast-mid{display:none;}
    .chip{font-size:12px;padding:7px 10px;}
    .bar{padding:9px 12px;}
    .verdict{font-size:11px;}
    button.act{font-size:13px;padding:7px 14px;}
  }
  @media (max-width:440px){
    .bins.two{grid-template-columns:1fr;}
    .dots{gap:4px;}
    .dot{width:6px;height:6px;}
  }
  @media (prefers-reduced-motion:reduce){
    .track,.page,.chip{transition:none;}
  }
</style>
</head>
<body>

<header class="mast">
  <div class="mast-tab"><b>Econ Notes #1</b></div>
  <div class="mast-mid">Review Game &middot; What Is Economics?</div>
  <div class="mast-right">
    <div class="dots" id="dots"></div>
    <div class="score"><i>SCORE</i> <b id="score">0</b>/<b id="outof">64</b></div>
  </div>
</header>

<main class="stage">
  <div class="track" id="track"></div>
</main>

<div class="bar">
  <div class="verdict" id="verdict">Place every card, then check your answers.</div>
  <div class="btns">
    <button class="act ghost" id="back" type="button">Back</button>
    <button class="act" id="check" type="button" disabled>Check answers</button>
    <button class="act go" id="next" type="button" style="display:none;">Next round</button>
  </div>
</div>

<script>
const ROUNDS = [
  {
    type:'bins',
    num:'01',
    title:'Is This Economics?',
    howto:'Tap a card, then tap the column it belongs in. Dragging works too.',
    layout:'two',
    bins:[
      {id:'yes', side:'blue', label:'ECONOMICS', sub:'The study of choices'},
      {id:'no', side:'navy', label:'NOT ECONOMICS', sub:'Business, finance, personal money'}
    ],
    items:[
      {t:'Why a city ends up short on housing', bin:'yes'},
      {t:'How a government decides to spend tax money', bin:'yes'},
      {t:'How a family chooses between two goods', bin:'yes'},
      {t:'Which stocks will make you rich', bin:'no'},
      {t:'How to write a business plan', bin:'no'},
      {t:'How to build a personal budget', bin:'no'}
    ]
  },
  {
    type:'bins',
    num:'02',
    title:'Micro or Macro?',
    howto:'One market, or the health of a whole nation?',
    layout:'two',
    bins:[
      {id:'micro', side:'cyan', label:'MICROECONOMICS', sub:'Buyers and sellers in one market'},
      {id:'macro', side:'blue', label:'MACROECONOMICS', sub:'The whole economy at once'}
    ],
    items:[
      {t:'Supply and demand for coffee', bin:'micro'},
      {t:'How one company sets its prices', bin:'micro'},
      {t:'A single family\u2019s spending choices', bin:'micro'},
      {t:'The national unemployment rate', bin:'macro'},
      {t:'Total value of everything the nation produced', bin:'macro'},
      {t:'Government policy on taxes and interest rates', bin:'macro'}
    ]
  },
  {
    type:'bins',
    num:'03',
    title:'Sort the Island\u2019s Resources',
    howto:'You are shipwrecked. Sort what you have into the four factors of production.',
    layout:'four',
    bins:[
      {id:'land', side:'gold', label:'LAND', sub:'Natural resources'},
      {id:'labor', side:'blue', label:'LABOR', sub:'Human effort and skill'},
      {id:'capital', side:'navy', label:'CAPITAL', sub:'Human made tools'},
      {id:'ent', side:'cyan', label:'ENTREPRENEUR', sub:'Ideas and risk'}
    ],
    items:[
      {t:'A freshwater spring inland', bin:'land'},
      {t:'Fruit trees along the ridge', bin:'land'},
      {t:'Three hours spent hauling firewood', bin:'labor'},
      {t:'Someone who already knows how to fish', bin:'labor'},
      {t:'The axe pulled off the wrecked ship', bin:'capital'},
      {t:'A fishing net woven from vines', bin:'capital'},
      {t:'The idea to build a signal fire', bin:'ent'},
      {t:'Organizing who does what, and risking it', bin:'ent'}
    ]
  },
  {
    type:'bins',
    num:'04',
    title:'Find the 3 Key Questions',
    howto:'Only three of these are the questions every economic system has to answer. The rest are impostors.',
    layout:'two',
    bins:[
      {id:'real', side:'blue', label:'A KEY QUESTION', sub:'Exactly three belong here'},
      {id:'fake', side:'navy', label:'NOT ONE OF THEM', sub:'Reasonable question, wrong list'}
    ],
    items:[
      {t:'What are we going to make?', bin:'real'},
      {t:'How are we going to make it?', bin:'real'},
      {t:'Who gets it?', bin:'real'},
      {t:'How much should it cost?', bin:'fake'},
      {t:'Where will we sell it?', bin:'fake'},
      {t:'When should we make it?', bin:'fake'},
      {t:'How do we get rich doing it?', bin:'fake'}
    ]
  },
  {
    type:'bins',
    num:'05',
    title:'Put the Economy in Order',
    howto:'Five stages, from raw resources all the way to the person using the good.',
    layout:'five',
    bins:[
      {id:'s1', side:'gold', label:'01'},
      {id:'s2', side:'blue', label:'02'},
      {id:'s3', side:'navy', label:'03'},
      {id:'s4', side:'blue', label:'04'},
      {id:'s5', side:'cyan', label:'05'}
    ],
    items:[
      {t:'Limited Resources', bin:'s1'},
      {t:'Allocation', bin:'s2'},
      {t:'Production', bin:'s3'},
      {t:'Distribution', bin:'s4'},
      {t:'Consumption', bin:'s5'}
    ]
  },
  {
    type:'match',
    num:'06',
    title:'Terms and Meanings',
    howto:'Tap a term on the left, then tap its meaning on the right. Tap again to undo.',
    pairs:[
      {a:'Scarcity', b:'Unlimited wants, limited resources available'},
      {a:'Opportunity Cost', b:'Value of the next best alternative'},
      {a:'Trade-off', b:'Every choice gives something else up'},
      {a:'Command Economy', b:'Central planners direct all economic activity'},
      {a:'Free Market', b:'Buyers and sellers transact freely'},
      {a:'Mixed Economy', b:'Free market plus government elements combined'}
    ]
  },
  {
    type:'bins',
    num:'07',
    title:'Who Answers the Question?',
    howto:'Same three key questions. Two very different systems answering them.',
    layout:'two',
    bins:[
      {id:'mkt', side:'cyan', label:'FREE MARKET', sub:'Individuals and businesses'},
      {id:'gov', side:'navy', label:'GOVERNMENT', sub:'Central planners'}
    ],
    items:[
      {t:'Shoe companies choose which styles to produce', bin:'mkt'},
      {t:'A bus company drops a route that loses money', bin:'mkt'},
      {t:'Prices and wages set by supply and demand', bin:'mkt'},
      {t:'States run schools so everyone can attend', bin:'gov'},
      {t:'Planners build one car for every household', bin:'gov'},
      {t:'Production targets set by a central agency', bin:'gov'}
    ]
  },
  {
    type:'match',
    num:'08',
    title:'What Do We Want From an Economy?',
    howto:'All eight goals. Match each one to what it actually means.',
    pairs:[
      {a:'Growth', b:'Rising output, rising standard of living'},
      {a:'Efficiency', b:'Maximum use of resources, minimum waste'},
      {a:'Economic Freedom', b:'People and businesses free to choose'},
      {a:'Stable Prices', b:'Prices steady, inflation under control'},
      {a:'Full Employment', b:'Few people are out of work'},
      {a:'Equity', b:'Fair distribution, basic necessities met'},
      {a:'Social Welfare', b:'Less poverty, unemployment and inequality'},
      {a:'Environmental Sustainability', b:'Growth that does not exhaust resources'}
    ]
  },
  {
    type:'bins',
    num:'09',
    title:'What Is the Free Market Good At?',
    howto:'Three goals the free market usually delivers on its own. Three it tends to miss.',
    layout:'two',
    bins:[
      {id:'good', side:'cyan', label:'MARKET DELIVERS', sub:'Usually good at this'},
      {id:'hard', side:'navy', label:'MARKET STRUGGLES', sub:'Usually needs help here'}
    ],
    items:[
      {t:'Growth', bin:'good'},
      {t:'Efficiency and innovation', bin:'good'},
      {t:'Economic freedom', bin:'good'},
      {t:'Equity', bin:'hard'},
      {t:'Social welfare and security', bin:'hard'},
      {t:'Environmental sustainability', bin:'hard'}
    ]
  },
  {
    type:'bins',
    num:'10',
    title:'East Germany or West Germany?',
    howto:'One nation, two systems, forty years apart. Which side goes with each card?',
    layout:'two',
    bins:[
      {id:'east', side:'navy', label:'EAST GERMANY', sub:'Command economy'},
      {id:'west', side:'blue', label:'WEST GERMANY', sub:'Social market economy'}
    ],
    items:[
      {t:'One car model for the entire country', bin:'east'},
      {t:'An 11 year wait to buy a car', bin:'east'},
      {t:'Jobs guaranteed, wages kept roughly equal', bin:'east'},
      {t:'VW, BMW and Mercedes competing for buyers', bin:'west'},
      {t:'Three times wealthier per person by 1989', bin:'west'},
      {t:'Free markets plus a strong safety net', bin:'west'}
    ]
  }
];

const TOTAL = ROUNDS.reduce((s,r)=> s + (r.type==='bins' ? r.items.length : r.pairs.length), 0);
const state = ROUNDS.map(()=>({checked:false, got:0}));
let idx = 0;
let sel = null;
let dragged = null;

const track = document.getElementById('track');
const dotsEl = document.getElementById('dots');
const scoreEl = document.getElementById('score');
const verdictEl = document.getElementById('verdict');
const backBtn = document.getElementById('back');
const checkBtn = document.getElementById('check');
const nextBtn = document.getElementById('next');
document.getElementById('outof').textContent = TOTAL;

function shuffle(a){
  const c = a.slice();
  for(let i=c.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [c[i],c[j]] = [c[j],c[i]];
  }
  return c;
}

/* ---------- BUILD PAGES ---------- */
ROUNDS.forEach((r,i)=>{
  const page = document.createElement('section');
  page.className = 'page';
  const inner = document.createElement('div');
  inner.className = 'inner';
  inner.innerHTML =
    '<div class="headbar"><div class="rnum">ROUND '+r.num+'</div><h2>'+r.title+'</h2></div>'+
    '<div class="note">'+r.howto+'</div>';
  inner.appendChild(r.type==='bins' ? buildBins(r,i) : buildMatch(r,i));
  page.appendChild(inner);
  track.appendChild(page);
  const d = document.createElement('span');
  d.className = 'dot';
  dotsEl.appendChild(d);
});

const resultPage = document.createElement('section');
resultPage.className = 'page';
resultPage.innerHTML = '<div class="inner final" id="finalInner"></div>';
track.appendChild(resultPage);
const lastDot = document.createElement('span');
lastDot.className = 'dot';
dotsEl.appendChild(lastDot);

/* ---------- BIN ROUND ---------- */
function buildBins(r, ri){
  const wrap = document.createElement('div');

  const pool = document.createElement('div');
  pool.className = 'pool';
  pool.dataset.bin = 'pool';

  shuffle(r.items).forEach(it=>{
    const c = document.createElement('div');
    c.className = 'chip';
    c.textContent = it.t;
    c.draggable = true;
    c.dataset.bin = it.bin;
    c.tabIndex = 0;
    c.addEventListener('click', ()=>pickChip(c, ri));
    c.addEventListener('keydown', e=>{ if(e.key==='Enter'||e.key===' '){e.preventDefault();pickChip(c,ri);} });
    c.addEventListener('dragstart', e=>{ if(state[ri].checked){e.preventDefault();return;} dragged = c; c.classList.add('sel'); });
    c.addEventListener('dragend', ()=>{ if(dragged) dragged.classList.remove('sel'); dragged = null; });
    pool.appendChild(c);
  });

  hookDrop(pool, pool, ri);
  wrap.appendChild(pool);

  const bins = document.createElement('div');
  bins.className = 'bins ' + r.layout;
  r.bins.forEach(b=>{
    const box = document.createElement('div');
    box.className = 'bin';
    box.dataset.side = b.side;
    box.innerHTML = '<div class="bin-head">'+b.label+(b.sub ? '<small>'+b.sub+'</small>' : '')+'</div>';
    const drop = document.createElement('div');
    drop.className = 'drop';
    drop.dataset.bin = b.id;
    box.appendChild(drop);
    hookDrop(drop, box, ri);
    bins.appendChild(box);
  });
  wrap.appendChild(bins);
  return wrap;
}

function hookDrop(zone, clickZone, ri){
  clickZone.addEventListener('click', e=>{
    if(e.target.closest('.chip')) return;
    if(sel && sel.ri === ri) placeChip(sel.el, zone, ri);
  });
  clickZone.addEventListener('dragover', e=>{ e.preventDefault(); clickZone.classList.add('over'); });
  clickZone.addEventListener('dragleave', ()=>clickZone.classList.remove('over'));
  clickZone.addEventListener('drop', e=>{
    e.preventDefault();
    clickZone.classList.remove('over');
    if(dragged) placeChip(dragged, zone, ri);
  });
}

function pickChip(c, ri){
  if(state[ri].checked) return;
  if(c.parentElement.dataset.bin !== 'pool'){
    placeChip(c, c.closest('.page').querySelector('.pool'), ri);
    return;
  }
  clearSel();
  sel = {el:c, ri:ri};
  c.classList.add('sel');
}

function placeChip(c, zone, ri){
  zone.appendChild(c);
  c.classList.remove('sel');
  clearSel();
  refreshBins(ri);
}

function clearSel(){
  document.querySelectorAll('.chip.sel').forEach(x=>x.classList.remove('sel'));
  sel = null;
}

function refreshBins(ri){
  const pool = track.children[ri].querySelector('.pool');
  pool.classList.toggle('empty', pool.children.length===0);
  checkBtn.disabled = pool.children.length !== 0;
}

/* ---------- MATCH ROUND ---------- */
function buildMatch(r, ri){
  const wrap = document.createElement('div');
  wrap.className = 'match';

  const L = document.createElement('div');
  L.className = 'mcol';
  L.innerHTML = '<div class="mhead">Term</div>';
  const R = document.createElement('div');
  R.className = 'mcol';
  R.innerHTML = '<div class="mhead">Meaning</div>';

  r.pairs.forEach((p,n)=>{
    const l = document.createElement('div');
    l.className = 'chip left';
    l.dataset.key = n;
    l.tabIndex = 0;
    l.innerHTML = '<span class="badge" style="visibility:hidden;">0</span><span>'+p.a+'</span>';
    l.addEventListener('click', ()=>tapMatch(l,'L',ri));
    l.addEventListener('keydown', e=>{ if(e.key==='Enter'||e.key===' '){e.preventDefault();tapMatch(l,'L',ri);} });
    L.appendChild(l);
  });

  shuffle(r.pairs.map((p,n)=>({t:p.b,key:n}))).forEach(p=>{
    const rr = document.createElement('div');
    rr.className = 'chip right';
    rr.dataset.key = p.key;
    rr.tabIndex = 0;
    rr.innerHTML = '<span class="badge" style="visibility:hidden;">0</span><span>'+p.t+'</span>';
    rr.addEventListener('click', ()=>tapMatch(rr,'R',ri));
    rr.addEventListener('keydown', e=>{ if(e.key==='Enter'||e.key===' '){e.preventDefault();tapMatch(rr,'R',ri);} });
    R.appendChild(rr);
  });

  wrap.appendChild(L);
  wrap.appendChild(R);
  return wrap;
}

function tapMatch(el, side, ri){
  if(state[ri].checked) return;

  if(el.dataset.pair){
    const twin = track.children[ri].querySelector('.chip.'+(side==='L'?'right':'left')+'[data-pair="'+el.dataset.pair+'"]');
    unpair(el);
    if(twin) unpair(twin);
    refreshMatch(ri);
    return;
  }

  if(!sel || sel.ri !== ri || sel.side === side){
    clearSel();
    sel = {el:el, side:side, ri:ri};
    el.classList.add('sel');
    return;
  }

  const n = nextPairNum(ri);
  stampPair(sel.el, n);
  stampPair(el, n);
  clearSel();
  refreshMatch(ri);
}

function nextPairNum(ri){
  const used = [...track.children[ri].querySelectorAll('.chip[data-pair]')].map(x=>+x.dataset.pair);
  let n = 1;
  while(used.includes(n)) n++;
  return n;
}

function stampPair(el, n){
  el.dataset.pair = n;
  const b = el.querySelector('.badge');
  b.textContent = n;
  b.style.visibility = 'visible';
}

function unpair(el){
  delete el.dataset.pair;
  const b = el.querySelector('.badge');
  b.textContent = '0';
  b.style.visibility = 'hidden';
}

function refreshMatch(ri){
  const done = track.children[ri].querySelectorAll('.chip.left[data-pair]').length;
  checkBtn.disabled = done !== ROUNDS[ri].pairs.length;
}

/* ---------- CHECKING ---------- */
checkBtn.addEventListener('click', ()=>{
  const r = ROUNDS[idx];
  const page = track.children[idx];
  let got = 0;

  if(r.type==='bins'){
    page.querySelectorAll('.drop').forEach(zone=>{
      [...zone.children].forEach(c=>{
        c.classList.add('locked');
        c.draggable = false;
        if(c.dataset.bin === zone.dataset.bin){ c.classList.add('ok'); got++; }
        else c.classList.add('no');
      });
    });
  } else {
    page.querySelectorAll('.chip.left').forEach(l=>{
      const partner = page.querySelector('.chip.right[data-pair="'+l.dataset.pair+'"]');
      l.classList.add('locked');
      if(partner) partner.classList.add('locked');
      if(partner && partner.dataset.key === l.dataset.key){
        l.classList.add('ok');
        partner.classList.add('ok');
        got++;
      } else {
        l.classList.add('no');
        if(partner) partner.classList.add('no');
        const fix = document.createElement('div');
        fix.className = 'fix';
        fix.textContent = '\u21B3 ' + r.pairs[+l.dataset.key].b;
        l.after(fix);
      }
    });
  }

  state[idx].checked = true;
  state[idx].got = got;
  scoreEl.textContent = state.reduce((s,x)=>s+x.got,0);

  const n = (r.type==='bins') ? r.items.length : r.pairs.length;
  verdictEl.innerHTML = got===n
    ? '<b>Clean sweep.</b> ' + got + ' of ' + n + ' correct.'
    : 'You got <b>' + got + ' of ' + n + '</b>. Red cards show what missed.';

  checkBtn.style.display = 'none';
  nextBtn.style.display = 'inline-block';
  nextBtn.textContent = (idx === ROUNDS.length-1) ? 'See results' : 'Next round';
  clearSel();
});

/* ---------- NAVIGATION ---------- */
nextBtn.addEventListener('click', ()=>go(idx+1));
backBtn.addEventListener('click', ()=>go(idx-1));

document.addEventListener('keydown', e=>{
  if(e.target.classList && e.target.classList.contains('chip')) return;
  if(e.key==='ArrowRight' && nextBtn.style.display!=='none') go(idx+1);
  if(e.key==='ArrowLeft') go(idx-1);
});

function go(n){
  if(n < 0 || n > ROUNDS.length) return;
  if(n > idx && idx < ROUNDS.length && !state[idx].checked) return;
  idx = n;
  track.style.transform = 'translateX(-' + (idx*100) + '%)';
  [...track.children].forEach((p,i)=>p.classList.toggle('live', i===idx));
  [...dotsEl.children].forEach((d,i)=>{
    d.classList.toggle('here', i===idx);
    d.classList.toggle('done', i<idx);
  });
  clearSel();
  syncBar();
  if(track.children[idx]) track.children[idx].scrollTop = 0;
}

function syncBar(){
  backBtn.style.display = idx===0 ? 'none' : 'inline-block';

  if(idx >= ROUNDS.length){
    checkBtn.style.display = 'none';
    nextBtn.style.display = 'none';
    verdictEl.textContent = 'Unit 1 review complete.';
    renderFinal();
    return;
  }

  const r = ROUNDS[idx];
  const n = (r.type==='bins') ? r.items.length : r.pairs.length;

  if(state[idx].checked){
    checkBtn.style.display = 'none';
    nextBtn.style.display = 'inline-block';
    nextBtn.textContent = (idx === ROUNDS.length-1) ? 'See results' : 'Next round';
    verdictEl.innerHTML = 'Round ' + r.num + ' scored <b>' + state[idx].got + ' of ' + n + '</b>.';
  } else {
    checkBtn.style.display = 'inline-block';
    nextBtn.style.display = 'none';
    verdictEl.textContent = 'Round ' + (idx+1) + ' of ' + ROUNDS.length + '. ' +
      (r.type==='bins' ? 'Place every card, then check your answers.' : 'Pair every term, then check your answers.');
    if(r.type==='bins') refreshBins(idx); else refreshMatch(idx);
  }
}

/* ---------- RESULTS ---------- */
function renderFinal(){
  const total = state.reduce((s,x)=>s+x.got,0);
  const pct = Math.round(total/TOTAL*100);
  let rank, sub;
  if(pct>=90){
    rank = 'You are thinking like an economist.';
    sub = 'Scarcity, the factors, the three key questions and the goals are all locked in. Bring that to the discussion questions.';
  } else if(pct>=75){
    rank = 'Solid. A few gaps worth patching.';
    sub = 'Find your weakest round below and go back to those notes before the test.';
  } else if(pct>=55){
    rank = 'The foundation is there. The details are not yet.';
    sub = 'Most misses at this level land on the eight goals. Run it again and slow down on that round.';
  } else {
    rank = 'Time for another pass through the notes.';
    sub = 'Go back through Econ Notes #1, then come back and run this again. It is built to be replayed.';
  }

  let rows = '';
  ROUNDS.forEach((r,i)=>{
    const n = (r.type==='bins') ? r.items.length : r.pairs.length;
    const g = state[i].got;
    const cls = g===n ? 'full' : (g >= n*0.6 ? 'part' : 'thin');
    rows += '<div class="trow ' + cls + '"><span>' + r.num + ' &middot; ' + r.title + '</span><b>' + g + ' / ' + n + '</b></div>';
  });

  document.getElementById('finalInner').innerHTML =
    '<div class="headbar"><div class="rnum">DONE</div><h2>Final Score</h2></div>' +
    '<div class="bignum">' + total + '<em> / ' + TOTAL + '</em></div>' +
    '<div class="rank">' + rank + '</div>' +
    '<div class="ranksub">' + sub + '</div>' +
    '<div class="tally">' + rows + '</div>' +
    '<div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:20px;">' +
      '<button class="act" type="button" onclick="location.reload()">Play again</button>' +
    '</div>' +
    '<a class="backlink" href="unit-1.html">Back to the case study</a>';
}

go(0);
</script>
