<title>Unit 3 Review · What Is Money?</title>

<!-- ============ THEME: FONTS ============
     Swap to whatever the unit's deck uses.
     Unit 1 uses Oswald + Roboto + Permanent Marker. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Roboto:wght@400;500;700&family=Permanent+Marker&display=swap" rel="stylesheet">

<style>
  /* ================= THEME: COLOR + TYPE =================
     c1  primary bar color        (masthead, round header, buttons)
     c2  dark anchor              (tabs, secondary bins)
     c3  bright accent            (third bin color)
     c4  highlight                (selection, Next button, fourth bin)
     Each has a matching -ink for readable text on top of it.
     ======================================================== */
  :root{
    --c1:#5e8850;      --c1-ink:#ffffff;
    --c2:#2f5d2a;      --c2-ink:#ffffff;
    --c3:#a9c496;      --c3-ink:#22321b;
    --c4:#d9b13c;      --c4-ink:#1a1a1a;

    --ground:#d8d8d8;  /* page background */
    --dot:#c1c1c1;     /* halftone dot, set equal to ground to remove texture */
    --panel:#eeeeee;   /* bin body */
    --ink:#242424;     /* body text */
    --line:#111111;    /* hard border */
    --ok:#2e7d4f;
    --no:#c1272d;

    --head:'Oswald',sans-serif;
    --body:'Roboto',sans-serif;
    --marker:'Permanent Marker',cursive;

    --mast:50px;
  }

  /* ================= ENGINE STYLES: do not edit ================= */
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;}
  body{
    background-color:var(--ground);
    background-image:radial-gradient(var(--dot) 1.1px, transparent 1.1px);
    background-size:6px 6px;
    color:var(--ink);font-family:var(--body);
    overflow:hidden;-webkit-text-size-adjust:100%;
  }

  .mast{
    position:fixed;top:0;left:0;right:0;height:var(--mast);
    display:flex;align-items:stretch;background:var(--c1);
    border-bottom:3px solid var(--line);z-index:60;
  }
  .mast-tab{
    background:var(--c2);color:var(--c2-ink);
    display:flex;align-items:center;padding:0 22px 0 14px;
    clip-path:polygon(0 0,100% 0,calc(100% - 14px) 100%,0 100%);
  }
  .mast-tab b{font-family:var(--head);font-weight:700;font-size:19px;letter-spacing:.5px;text-transform:uppercase;line-height:1;}
  .mast-mid{
    flex:1;display:flex;align-items:center;padding:0 14px;
    font-family:var(--head);font-weight:500;font-size:13px;letter-spacing:1.6px;
    text-transform:uppercase;color:var(--c1-ink);opacity:.85;
    white-space:nowrap;overflow:hidden;
  }
  .mast-right{display:flex;align-items:center;gap:12px;padding:0 14px;}
  .dots{display:flex;gap:5px;align-items:center;}
  .dot{width:8px;height:8px;background:rgba(255,255,255,.3);border:1px solid rgba(0,0,0,.25);
    transition:background .2s ease,transform .2s ease;}
  .dot.done{background:#fff;}
  .dot.here{background:var(--c4);transform:scale(1.45);}
  .score{font-family:var(--head);font-weight:600;font-size:19px;color:var(--c1-ink);line-height:1;white-space:nowrap;}
  .score i{font-style:normal;font-size:10px;letter-spacing:1.5px;opacity:.7;}

  .stage{position:fixed;top:var(--mast);left:0;right:0;bottom:0;overflow:hidden;}
  .track{display:flex;height:100%;width:100%;
    transition:transform .5s cubic-bezier(.6,.02,.2,1);will-change:transform;}
  .page{flex:0 0 100%;height:100%;overflow-y:auto;padding:20px 26px 98px;
    opacity:.2;transition:opacity .4s ease;}
  .page.live{opacity:1;}
  .inner{max-width:900px;margin:0 auto;}

  .headbar{display:flex;align-items:stretch;filter:drop-shadow(3px 3px 0 rgba(0,0,0,.24));margin-bottom:14px;}
  .headbar .rnum{
    background:var(--c2);color:var(--c2-ink);
    font-family:var(--head);font-weight:600;font-size:14px;letter-spacing:1.5px;
    display:flex;align-items:center;padding:7px 20px 7px 12px;
    clip-path:polygon(0 0,100% 0,calc(100% - 13px) 100%,0 100%);
  }
  .headbar h2{
    background:var(--c1);color:var(--c1-ink);flex:1;
    font-family:var(--head);font-weight:600;
    font-size:clamp(18px,3.4vw,29px);letter-spacing:.5px;text-transform:uppercase;
    line-height:1.15;padding:6px 34px 6px 16px;margin-left:-13px;
    display:flex;align-items:center;
    clip-path:polygon(0 0,calc(100% - 20px) 0,100% 50%,calc(100% - 20px) 100%,0 100%);
  }

  .note{
    display:inline-block;background:#fff;border:2px solid var(--line);
    font-family:var(--marker);font-size:12.5px;line-height:1.45;color:#1a1a1a;
    padding:8px 13px;margin:2px 0 18px 6px;transform:rotate(-.7deg);
    box-shadow:3px 3px 0 rgba(0,0,0,.22);max-width:620px;
  }

  .chip{
    display:inline-flex;align-items:center;gap:8px;
    background:#fff;color:var(--ink);font-family:var(--body);font-size:13px;line-height:1.35;
    padding:8px 12px;border:2px solid var(--line);box-shadow:2px 2px 0 rgba(0,0,0,.28);
    cursor:pointer;user-select:none;
    transition:transform .1s ease,background .12s ease,box-shadow .12s ease;
  }
  .chip:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 rgba(0,0,0,.28);}
  .chip.sel{background:var(--c4);color:var(--c4-ink);box-shadow:4px 4px 0 rgba(0,0,0,.35);}
  .chip.ok{background:var(--ok);color:#fff;}
  .chip.no{background:var(--no);color:#fff;}
  .chip.locked{cursor:default;}
  .chip.locked:hover{transform:none;box-shadow:2px 2px 0 rgba(0,0,0,.28);}
  .badge{
    font-family:var(--head);font-weight:600;font-size:11px;
    background:var(--c1);color:var(--c1-ink);width:18px;height:18px;flex:0 0 18px;
    display:inline-flex;align-items:center;justify-content:center;
  }
  .chip.ok .badge,.chip.no .badge{background:rgba(0,0,0,.3);color:#fff;}

  .pool{
    display:flex;flex-wrap:wrap;gap:9px;align-content:flex-start;
    min-height:58px;padding:12px;margin-bottom:16px;
    border:2px dashed rgba(0,0,0,.3);background:rgba(255,255,255,.35);
  }
  .pool.over{border-color:var(--c1);background:rgba(0,0,0,.05);}
  .pool.empty::after{
    content:'All placed. Hit Check answers.';
    font-family:var(--head);font-weight:500;font-size:11px;letter-spacing:2px;
    text-transform:uppercase;color:rgba(0,0,0,.35);
  }

  .bins{display:grid;gap:12px;}
  .bins.two{grid-template-columns:1fr 1fr;}
  .bins.three{grid-template-columns:repeat(3,1fr);}
  .bins.four{grid-template-columns:repeat(4,1fr);}
  .bins.five{grid-template-columns:repeat(5,1fr);gap:16px;}
  .bin{
    position:relative;background:var(--panel);border:2px solid var(--line);
    box-shadow:3px 3px 0 rgba(0,0,0,.24);min-height:132px;padding-bottom:10px;
    transition:background .12s ease;
  }
  .bin.over{background:#fff8dd;}
  .bin-head{
    font-family:var(--head);font-weight:600;font-size:15px;letter-spacing:.8px;
    text-transform:uppercase;padding:7px 11px;margin-bottom:9px;line-height:1.15;
    border-bottom:2px solid var(--line);
  }
  .bin-head small{
    display:block;font-family:var(--body);font-weight:400;font-size:10px;
    letter-spacing:.2px;text-transform:none;opacity:.85;margin-top:2px;
  }
  .bin[data-side="c1"] .bin-head{background:var(--c1);color:var(--c1-ink);}
  .bin[data-side="c2"] .bin-head{background:var(--c2);color:var(--c2-ink);}
  .bin[data-side="c3"] .bin-head{background:var(--c3);color:var(--c3-ink);}
  .bin[data-side="c4"] .bin-head{background:var(--c4);color:var(--c4-ink);}
  .drop{display:flex;flex-wrap:wrap;align-content:flex-start;gap:7px;padding:0 9px;min-height:76px;}

  .bins.five .bin{min-height:108px;}
  .bins.five .drop{min-height:54px;}
  .bins.five .bin-head{font-size:20px;text-align:center;}
  .bins.five .bin:not(:last-child)::after{
    content:'\203A';position:absolute;right:-14px;top:50%;transform:translateY(-50%);
    font-family:var(--head);font-weight:700;font-size:26px;color:var(--c2);
    line-height:1;pointer-events:none;
  }

  .match{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .mcol{display:flex;flex-direction:column;gap:8px;}
  .mhead{
    font-family:var(--head);font-weight:600;font-size:11px;letter-spacing:2.5px;
    text-transform:uppercase;color:var(--c2-ink);background:var(--c2);
    padding:5px 10px;border:2px solid var(--line);
  }
  .mcol .chip{width:100%;justify-content:flex-start;}
  .mcol .chip.left{background:var(--panel);font-weight:700;}
  .mcol .chip.left.sel{background:var(--c4);color:var(--c4-ink);}
  .mcol .chip.left.ok,.mcol .chip.left.no{color:#fff;}
  .fix{font-family:var(--marker);font-size:11.5px;line-height:1.4;color:#8a1a1f;padding:1px 4px 3px;}

  .cwrap{width:100%;overflow-x:auto;margin-bottom:16px;}
  .cflow{position:relative;min-width:640px;max-width:880px;margin:0 auto;
    border:2px solid var(--line);box-shadow:3px 3px 0 rgba(0,0,0,.24);line-height:0;}
  .cflow img{width:100%;display:block;}
  .spot{
    position:absolute;display:flex;align-items:center;justify-content:center;
    background:var(--panel);border:2px solid var(--line);
    box-shadow:2px 2px 0 rgba(0,0,0,.3);overflow:hidden;line-height:1.2;
  }
  .spot.over{background:#fff8dd;}
  .spot::after{
    content:'?';font-family:var(--head);font-weight:700;font-size:15px;
    color:rgba(0,0,0,.28);
  }
  .spot.filled::after{display:none;}
  .spot .chip{
    width:100%;height:100%;margin:0;border:none;box-shadow:none;
    font-size:10.5px;line-height:1.2;text-align:center;padding:3px 4px;
    justify-content:center;
  }
  .spot .chip:hover{transform:none;box-shadow:none;}
  .spotfix{
    border:2px solid var(--line);background:#fff;box-shadow:3px 3px 0 rgba(0,0,0,.24);
    padding:9px 12px;margin-bottom:6px;
  }
  .spotfix div{font-family:var(--marker);font-size:11.5px;line-height:1.5;color:#8a1a1f;}

  .bar{
    position:fixed;left:0;right:0;bottom:0;
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:10px 18px;background:#fff;border-top:3px solid var(--line);z-index:50;
  }
  .verdict{font-family:var(--body);font-size:12.5px;color:#444;min-height:16px;}
  .verdict b{font-family:var(--head);font-weight:600;color:var(--c2);letter-spacing:.5px;}
  .btns{display:flex;gap:9px;}
  button.act{
    font-family:var(--head);font-weight:600;font-size:15px;letter-spacing:1.2px;
    text-transform:uppercase;padding:8px 20px;cursor:pointer;line-height:1.2;
    background:var(--c1);color:var(--c1-ink);border:2px solid var(--line);
    box-shadow:3px 3px 0 rgba(0,0,0,.3);
    transition:transform .1s ease,box-shadow .1s ease,opacity .12s ease;
  }
  button.act:hover:not(:disabled){transform:translate(-1px,-1px);box-shadow:5px 5px 0 rgba(0,0,0,.3);}
  button.act:disabled{opacity:.35;cursor:not-allowed;box-shadow:2px 2px 0 rgba(0,0,0,.2);}
  button.act.ghost{background:#fff;color:var(--ink);}
  button.act.go{background:var(--c4);color:var(--c4-ink);}

  .final{text-align:center;}
  .final .headbar{text-align:left;}
  .bignum{font-family:var(--head);font-weight:700;font-size:clamp(70px,16vw,132px);line-height:.95;color:var(--c2);}
  .bignum em{font-style:normal;font-size:.32em;color:#6d6d6d;}
  .rank{font-family:var(--marker);font-size:clamp(17px,3vw,24px);color:var(--ink);margin:6px 0 8px;line-height:1.3;}
  .ranksub{font-size:13.5px;line-height:1.65;color:#4a4a4a;max-width:520px;margin:0 auto 20px;}
  .tally{max-width:540px;margin:0 auto 20px;text-align:left;border:2px solid var(--line);box-shadow:3px 3px 0 rgba(0,0,0,.24);}
  .trow{display:flex;justify-content:space-between;align-items:center;gap:10px;
    background:#fff;padding:7px 12px;font-size:12.5px;border-bottom:1px solid #d0d0d0;}
  .trow:last-child{border-bottom:0;}
  .trow b{font-family:var(--head);font-weight:600;font-size:15px;}
  .trow.full b{color:var(--ok);}
  .trow.part b{color:#b07d00;}
  .trow.thin b{color:var(--no);}
  .backlink{
    display:inline-block;font-family:var(--head);font-weight:500;font-size:12px;
    letter-spacing:1.6px;text-transform:uppercase;color:var(--c2);
    text-decoration:none;border-bottom:2px solid var(--c2);padding-bottom:1px;
  }
  .backlink:hover{color:var(--no);border-color:var(--no);}

  :focus-visible{outline:3px solid var(--c2);outline-offset:2px;}

  @media (max-width:760px){
    .page{padding:16px 14px 100px;}
    .bins.three,.bins.four{grid-template-columns:1fr 1fr;}
    .bins.five{grid-template-columns:1fr 1fr;gap:10px;}
    .bins.five .bin::after{display:none;}
    .match{grid-template-columns:1fr;gap:16px;}
    .mast-mid{display:none;}
    .chip{font-size:12px;padding:7px 10px;}
    .bar{padding:9px 12px;}
    .verdict{font-size:11px;}
    button.act{font-size:13px;padding:7px 14px;}
  }
  @media (max-width:440px){
    .bins.two{grid-template-columns:1fr;}
    .dots{gap:4px;}
    .dot{width:6px;height:6px;}
  }
  @media (prefers-reduced-motion:reduce){
    .track,.page,.chip{transition:none;}
  }
</style>
</head>
<body>

<header class="mast">
  <div class="mast-tab"><b id="mastTab">Econ Notes #X</b></div>

    <div class="dots" id="dots"></div>

<main class="stage"><div class="track" id="track"></div></main>

</div>

   ========================================================================== */

  subtitle: 'Review Game \u00B7 What Is Money?',
  backHref: 'unit-3b.html',
  backText: 'Back to the Unit 3 reference page'

  {min:90, rank:'You understand what money actually is.',        sub:'You could explain Weimar to someone who was not in class. Bring this to the discussion questions.'},

];

const ROUNDS = [

  /* ---- 01 ---- deck slides 5 to 7 ---- */
  {
    type:'bins',

    title:'The Three Jobs of Money',
    howto:'Money does three separate jobs at once. Sort each example into the job it shows. Tap a card, then tap a column. Dragging works too.',

    bins:[

      {a:'Gold Standard',               b:'Currency you can trade in for gold'},

  /* ---- 03 ---- deck slide 11 ---- */

      {id:'ln2', x:31.0, y:57.5, w:13.5, h:9.5,  where:'Lower left, the arrow from the bank down to businesses'}
    ],
    items:[
      {t:'Loans to households',   bin:'ln1'},
      {t:'Loans to businesses',   bin:'ln2'},
      {t:'Taxes from households', bin:'tx1'},
      {t:'Taxes from businesses', bin:'tx2'},
      {t:'Spending on households', bin:'sp1'},
      {t:'Spending on businesses', bin:'sp2'}
    ]
  },

  /* ---- 10 ---- case study, the equation ---- */
  {
    type:'match',
    num:'10',
    title:'M &times; V = P &times; Q',
    howto:'The equation of exchange. Four letters, four meanings. Last round, make it count.',
    pairs:[
      {a:'M \u00B7 Money Supply', b:'How much money exists in circulation'},
      {a:'V \u00B7 Velocity',     b:'How fast money changes hands'},
      {a:'P \u00B7 Price Level',  b:'The average price of goods sold'},
      {a:'Q \u00B7 Real Output',  b:'How much actual stuff gets produced'}
    ]
  }

];

/* ==========================================================================
   ENGINE  ·  nothing below needs editing
   ========================================================================== */

function count(r){ return r.type==='match' ? r.pairs.length : (r.type==='image' ? r.spots.length : r.items.length); }
const TOTAL = ROUNDS.reduce((s,r)=> s + count(r), 0);
const state = ROUNDS.map(()=>({checked:false, got:0}));
let idx = 0, sel = null, dragged = null;

const track = document.getElementById('track');
const dotsEl = document.getElementById('dots');
const scoreEl = document.getElementById('score');
const verdictEl = document.getElementById('verdict');
const backBtn = document.getElementById('back');
const checkBtn = document.getElementById('check');
const nextBtn = document.getElementById('next');

document.getElementById('outof').textContent = TOTAL;
document.getElementById('mastTab').textContent = UNIT.tab;
document.getElementById('mastMid').textContent = UNIT.subtitle;
document.title = UNIT.tab + ' Review';

function shuffle(a){
  const c = a.slice();
  for(let i=c.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [c[i],c[j]]=[c[j],c[i]]; }
  return c;
}

ROUNDS.forEach((r,i)=>{
  const page = document.createElement('section');
  page.className = 'page';
  const inner = document.createElement('div');
  inner.className = 'inner';
  inner.innerHTML =
    '<div class="headbar"><div class="rnum">ROUND '+r.num+'</div><h2>'+r.title+'</h2></div>'+
    '<div class="note">'+r.howto+'</div>';
  inner.appendChild(r.type==='bins' ? buildBins(r,i) : (r.type==='image' ? buildImage(r,i) : buildMatch(r,i)));
  page.appendChild(inner);
  track.appendChild(page);
  const d = document.createElement('span'); d.className='dot'; dotsEl.appendChild(d);
});

const resultPage = document.createElement('section');
resultPage.className = 'page';
resultPage.innerHTML = '<div class="inner final" id="finalInner"></div>';
track.appendChild(resultPage);
const lastDot = document.createElement('span'); lastDot.className='dot'; dotsEl.appendChild(lastDot);

function buildBins(r, ri){
  const wrap = document.createElement('div');
  const pool = document.createElement('div');
  pool.className = 'pool';
  pool.dataset.bin = 'pool';

  shuffle(r.items).forEach(it=>{
    const c = document.createElement('div');
    c.className = 'chip';
    c.textContent = it.t;
    c.draggable = true;
    c.dataset.bin = it.bin;
    c.tabIndex = 0;
    c.addEventListener('click', ()=>pickChip(c, ri));
    c.addEventListener('keydown', e=>{ if(e.key==='Enter'||e.key===' '){e.preventDefault();pickChip(c,ri);} });
    c.addEventListener('dragstart', e=>{ if(state[ri].checked){e.preventDefault();return;} dragged=c; c.classList.add('sel'); });
    c.addEventListener('dragend', ()=>{ if(dragged) dragged.classList.remove('sel'); dragged=null; });
    pool.appendChild(c);
  });

  hookDrop(pool, pool, ri);
  wrap.appendChild(pool);

  const bins = document.createElement('div');
  bins.className = 'bins ' + r.layout;
  r.bins.forEach(b=>{
    const box = document.createElement('div');
    box.className = 'bin';
    box.dataset.side = b.side;
    box.innerHTML = '<div class="bin-head">'+b.label+(b.sub ? '<small>'+b.sub+'</small>' : '')+'</div>';
    const drop = document.createElement('div');
    drop.className = 'drop';
    drop.dataset.bin = b.id;
    box.appendChild(drop);
    hookDrop(drop, box, ri);
    bins.appendChild(box);
  });
  wrap.appendChild(bins);
  return wrap;
}

function hookDrop(zone, clickZone, ri){
  clickZone.addEventListener('click', e=>{
    if(e.target.closest('.chip')) return;
    if(sel && sel.ri === ri) placeChip(sel.el, zone, ri);
  });
  clickZone.addEventListener('dragover', e=>{ e.preventDefault(); clickZone.classList.add('over'); });
  clickZone.addEventListener('dragleave', ()=>clickZone.classList.remove('over'));
  clickZone.addEventListener('drop', e=>{
    e.preventDefault(); clickZone.classList.remove('over');
    if(dragged) placeChip(dragged, zone, ri);
  });
}

function pickChip(c, ri){
  if(state[ri].checked) return;
  if(c.parentElement.dataset.bin !== 'pool'){
    placeChip(c, c.closest('.page').querySelector('.pool'), ri);
    return;
  }
  clearSel();
  sel = {el:c, ri:ri};
  c.classList.add('sel');
}

function placeChip(c, zone, ri){
  zone.appendChild(c);
  c.classList.remove('sel');
  clearSel();
  refreshBins(ri);
}

function clearSel(){
  document.querySelectorAll('.chip.sel').forEach(x=>x.classList.remove('sel'));
  sel = null;
}

function refreshBins(ri){
  const pool = track.children[ri].querySelector('.pool');
  pool.classList.toggle('empty', pool.children.length===0);
  checkBtn.disabled = pool.children.length !== 0;
}

function buildImage(r, ri){
  const wrap = document.createElement('div');

  const cw = document.createElement('div');
  cw.className = 'cwrap';
  const board = document.createElement('div');
  board.className = 'cflow';
  const img = document.createElement('img');
  img.src = r.img;
  img.alt = r.alt || 'Diagram';
  board.appendChild(img);

  r.spots.forEach(sp=>{
    const z = document.createElement('div');
    z.className = 'spot';
    z.dataset.bin = sp.id;
    z.style.left   = sp.x + '%';
    z.style.top    = sp.y + '%';
    z.style.width  = sp.w + '%';
    z.style.height = sp.h + '%';
    hookSpot(z, ri);
    board.appendChild(z);
  });
  cw.appendChild(board);
  wrap.appendChild(cw);

  const pool = document.createElement('div');
  pool.className = 'pool';
  pool.dataset.bin = 'pool';
  shuffle(r.items).forEach(it=>{
    const c = document.createElement('div');
    c.className = 'chip';
    c.textContent = it.t;
    c.draggable = true;
    c.dataset.bin = it.bin;
    c.tabIndex = 0;
    c.addEventListener('click', ()=>pickSpotChip(c, ri));
    c.addEventListener('keydown', e=>{ if(e.key==='Enter'||e.key===' '){e.preventDefault();pickSpotChip(c,ri);} });
    c.addEventListener('dragstart', e=>{ if(state[ri].checked){e.preventDefault();return;} dragged=c; c.classList.add('sel'); });
    c.addEventListener('dragend', ()=>{ if(dragged) dragged.classList.remove('sel'); dragged=null; });
    pool.appendChild(c);
  });
  hookSpotPool(pool, ri);
  wrap.appendChild(pool);
  return wrap;
}

function hookSpot(zone, ri){
  zone.addEventListener('click', e=>{
    if(state[ri].checked) return;
    if(e.target.closest('.chip') && e.target.closest('.chip').parentElement === zone){
      returnChip(e.target.closest('.chip'), ri); return;
    }
    if(sel && sel.ri === ri) dropInSpot(sel.el, zone, ri);
  });
  zone.addEventListener('dragover', e=>{ e.preventDefault(); zone.classList.add('over'); });
  zone.addEventListener('dragleave', ()=>zone.classList.remove('over'));
  zone.addEventListener('drop', e=>{
    e.preventDefault(); zone.classList.remove('over');
    if(dragged) dropInSpot(dragged, zone, ri);
  });
}

function hookSpotPool(pool, ri){
  pool.addEventListener('click', e=>{
    if(e.target.closest('.chip')) return;
    if(sel && sel.ri === ri){ returnChip(sel.el, ri); }
  });
  pool.addEventListener('dragover', e=>{ e.preventDefault(); pool.classList.add('over'); });
  pool.addEventListener('dragleave', ()=>pool.classList.remove('over'));
  pool.addEventListener('drop', e=>{
    e.preventDefault(); pool.classList.remove('over');
    if(dragged) returnChip(dragged, ri);
  });
}

function pickSpotChip(c, ri){
  if(state[ri].checked) return;
  if(c.parentElement.classList.contains('spot')){ returnChip(c, ri); return; }
  clearSel();
  sel = {el:c, ri:ri};
  c.classList.add('sel');
}

function dropInSpot(c, zone, ri){
  if(state[ri].checked) return;
  const sitting = zone.querySelector('.chip');
  if(sitting && sitting !== c) returnChip(sitting, ri);
  zone.appendChild(c);
  zone.classList.add('filled');
  c.classList.remove('sel');
  clearSel();
  refreshImage(ri);
}

function returnChip(c, ri){
  const from = c.parentElement;
  track.children[ri].querySelector('.pool').appendChild(c);
  if(from && from.classList.contains('spot')) from.classList.remove('filled');
  c.classList.remove('sel');
  clearSel();
  refreshImage(ri);
}

function refreshImage(ri){
  const pool = track.children[ri].querySelector('.pool');
  pool.classList.toggle('empty', pool.children.length===0);
  checkBtn.disabled = pool.children.length !== 0;
}

function buildMatch(r, ri){
  const wrap = document.createElement('div');
  wrap.className = 'match';
  const L = document.createElement('div'); L.className='mcol'; L.innerHTML='<div class="mhead">Term</div>';
  const R = document.createElement('div'); R.className='mcol'; R.innerHTML='<div class="mhead">Meaning</div>';

  r.pairs.forEach((p,n)=>{
    const l = document.createElement('div');
    l.className='chip left'; l.dataset.key=n; l.tabIndex=0;
    l.innerHTML = '<span class="badge" style="visibility:hidden;">0</span><span>'+p.a+'</span>';
    l.addEventListener('click', ()=>tapMatch(l,'L',ri));
    l.addEventListener('keydown', e=>{ if(e.key==='Enter'||e.key===' '){e.preventDefault();tapMatch(l,'L',ri);} });
    L.appendChild(l);
  });

  shuffle(r.pairs.map((p,n)=>({t:p.b,key:n}))).forEach(p=>{
    const rr = document.createElement('div');
    rr.className='chip right'; rr.dataset.key=p.key; rr.tabIndex=0;
    rr.innerHTML = '<span class="badge" style="visibility:hidden;">0</span><span>'+p.t+'</span>';
    rr.addEventListener('click', ()=>tapMatch(rr,'R',ri));
    rr.addEventListener('keydown', e=>{ if(e.key==='Enter'||e.key===' '){e.preventDefault();tapMatch(rr,'R',ri);} });
    R.appendChild(rr);
  });

  wrap.appendChild(L); wrap.appendChild(R);
  return wrap;
}

function tapMatch(el, side, ri){
  if(state[ri].checked) return;
  if(el.dataset.pair){
    const twin = track.children[ri].querySelector('.chip.'+(side==='L'?'right':'left')+'[data-pair="'+el.dataset.pair+'"]');
    unpair(el); if(twin) unpair(twin);
    refreshMatch(ri);
    return;
  }
  if(!sel || sel.ri !== ri || sel.side === side){
    clearSel(); sel = {el:el, side:side, ri:ri}; el.classList.add('sel');
    return;
  }
  const n = nextPairNum(ri);
  stampPair(sel.el, n); stampPair(el, n);
  clearSel(); refreshMatch(ri);
}

function nextPairNum(ri){
  const used = [...track.children[ri].querySelectorAll('.chip[data-pair]')].map(x=>+x.dataset.pair);
  let n = 1; while(used.includes(n)) n++;
  return n;
}
function stampPair(el, n){
  el.dataset.pair = n;
  const b = el.querySelector('.badge');
  b.textContent = n; b.style.visibility = 'visible';
}
function unpair(el){
  delete el.dataset.pair;
  const b = el.querySelector('.badge');
  b.textContent = '0'; b.style.visibility = 'hidden';
}
function refreshMatch(ri){
  const done = track.children[ri].querySelectorAll('.chip.left[data-pair]').length;
  checkBtn.disabled = done !== ROUNDS[ri].pairs.length;
}

checkBtn.addEventListener('click', ()=>{
  const r = ROUNDS[idx];
  const page = track.children[idx];
  let got = 0;

  if(r.type==='image'){
    const miss = [];
    page.querySelectorAll('.spot').forEach(zone=>{
      const c = zone.querySelector('.chip');
      if(!c) return;
      c.classList.add('locked'); c.draggable = false;
      if(c.dataset.bin === zone.dataset.bin){ c.classList.add('ok'); got++; }
      else {
        c.classList.add('no');
        const right = r.items.find(x=>x.bin===zone.dataset.bin);
        const sp = r.spots.find(x=>x.id===zone.dataset.bin);
        miss.push('\u21B3 ' + sp.where + ': ' + right.t);
      }
    });
    if(miss.length){
      const box = document.createElement('div');
      box.className = 'spotfix';
      box.innerHTML = miss.map(m=>'<div>'+m+'</div>').join('');
      page.querySelector('.cwrap').after(box);
    }
  } else if(r.type==='bins'){
    page.querySelectorAll('.drop').forEach(zone=>{
      [...zone.children].forEach(c=>{
        c.classList.add('locked'); c.draggable = false;
        if(c.dataset.bin === zone.dataset.bin){ c.classList.add('ok'); got++; }
        else c.classList.add('no');
      });
    });
  } else {
    page.querySelectorAll('.chip.left').forEach(l=>{
      const partner = page.querySelector('.chip.right[data-pair="'+l.dataset.pair+'"]');
      l.classList.add('locked');
      if(partner) partner.classList.add('locked');
      if(partner && partner.dataset.key === l.dataset.key){
        l.classList.add('ok'); partner.classList.add('ok'); got++;
      } else {
        l.classList.add('no');
        if(partner) partner.classList.add('no');
        const fix = document.createElement('div');
        fix.className = 'fix';
        fix.textContent = '\u21B3 ' + r.pairs[+l.dataset.key].b;
        l.after(fix);
      }
    });
  }

  state[idx].checked = true;
  state[idx].got = got;
  scoreEl.textContent = state.reduce((s,x)=>s+x.got,0);

  const n = count(r);
  verdictEl.innerHTML = got===n
    ? '<b>Clean sweep.</b> ' + got + ' of ' + n + ' correct.'
    : 'You got <b>' + got + ' of ' + n + '</b>. Red cards show what missed.';

  checkBtn.style.display = 'none';
  nextBtn.style.display = 'inline-block';
  nextBtn.textContent = (idx === ROUNDS.length-1) ? 'See results' : 'Next round';
  clearSel();
});

nextBtn.addEventListener('click', ()=>go(idx+1));
backBtn.addEventListener('click', ()=>go(idx-1));
document.addEventListener('keydown', e=>{
  if(e.target.classList && e.target.classList.contains('chip')) return;
  if(e.key==='ArrowRight' && nextBtn.style.display!=='none') go(idx+1);
  if(e.key==='ArrowLeft') go(idx-1);
});

function go(n){
  if(n < 0 || n > ROUNDS.length) return;
  if(n > idx && idx < ROUNDS.length && !state[idx].checked) return;
  idx = n;
  track.style.transform = 'translateX(-' + (idx*100) + '%)';
  [...track.children].forEach((p,i)=>p.classList.toggle('live', i===idx));
  [...dotsEl.children].forEach((d,i)=>{
    d.classList.toggle('here', i===idx);
    d.classList.toggle('done', i<idx);
  });
  clearSel();
  syncBar();
  if(track.children[idx]) track.children[idx].scrollTop = 0;
}

function syncBar(){
  backBtn.style.display = idx===0 ? 'none' : 'inline-block';
  if(idx >= ROUNDS.length){
    checkBtn.style.display='none'; nextBtn.style.display='none';
    verdictEl.textContent = 'Review complete.';
    renderFinal();
    return;
  }
  const r = ROUNDS[idx];
  const n = count(r);
  if(state[idx].checked){
    checkBtn.style.display='none';
    nextBtn.style.display='inline-block';
    nextBtn.textContent = (idx === ROUNDS.length-1) ? 'See results' : 'Next round';
    verdictEl.innerHTML = 'Round ' + r.num + ' scored <b>' + state[idx].got + ' of ' + n + '</b>.';
  } else {
    checkBtn.style.display='inline-block';
    nextBtn.style.display='none';
    verdictEl.textContent = 'Round ' + (idx+1) + ' of ' + ROUNDS.length + '. ' +
      (r.type==='match' ? 'Pair every term, then check your answers.' : 'Place every card, then check your answers.');
    if(r.type==='bins') refreshBins(idx);
    else if(r.type==='image') refreshImage(idx);
    else refreshMatch(idx);
  }
}

function renderFinal(){
  const total = state.reduce((s,x)=>s+x.got,0);
  const pct = Math.round(total/TOTAL*100);
  const tier = TIERS.find(t=>pct>=t.min) || TIERS[TIERS.length-1];

  let rows = '';
  ROUNDS.forEach((r,i)=>{
    const n = count(r);
    const g = state[i].got;
    const cls = g===n ? 'full' : (g >= n*0.6 ? 'part' : 'thin');
    rows += '<div class="trow '+cls+'"><span>'+r.num+' &middot; '+r.title+'</span><b>'+g+' / '+n+'</b></div>';
  });

  document.getElementById('finalInner').innerHTML =
    '<div class="headbar"><div class="rnum">DONE</div><h2>Final Score</h2></div>' +
    '<div class="bignum">' + total + '<em> / ' + TOTAL + '</em></div>' +
    '<div class="rank">' + tier.rank + '</div>' +
    '<div class="ranksub">' + tier.sub + '</div>' +
    '<div class="tally">' + rows + '</div>' +
    '<div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:20px;">' +
      '<button class="act" type="button" onclick="location.reload()">Play again</button>' +
    '</div>' +
    '<a class="backlink" href="' + UNIT.backHref + '">' + UNIT.backText + '</a>';
}

go(0);
</script>

</body>
</html>
